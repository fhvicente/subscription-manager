services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: subtrack
      POSTGRES_PASSWORD: subtrack
      POSTGRES_DB: subtrack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "subtrack"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
