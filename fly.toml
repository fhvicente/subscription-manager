# fly.toml app configuration file generated for gestor-sub on 2025-04-24T17:16:08+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gestor-sub'
primary_region = 'mad'

[build]
  dockerfile = 'Dockerfile'

[[mounts]]
  source = 'gestor_sub_data'
  destination = '/app/backend/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
